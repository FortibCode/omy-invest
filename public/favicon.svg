<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded background -->
  <rect width="100" height="100" rx="22" fill="#020B18"/>
  <rect width="96" height="96" x="2" y="2" rx="20" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- OMYA Split Circle Emblem ( ) -->
  <path d="M 32 30 C 18 30 18 70 32 70" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
  <path d="M 42 30 C 56 30 56 70 42 70" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Gold Accent Inner Dot / Spark -->
  <circle cx="37" cy="50" r="4" fill="#D4AF37"/>
  
  <!-- Text OMYA -->
  <text x="63" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="1">MYA</text>
  
  <!-- Text CAPITAL -->
  <text x="37" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#60A5FA" letter-spacing="2">CAPITAL</text>
